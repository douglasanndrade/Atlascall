# Atlas Call - roteamento interno (nginx) atras do proxy do EasyPanel.
# O EasyPanel termina o HTTPS e manda tudo para este nginx na porta 80.
#
# Importante: usamos o resolver do Docker (127.0.0.11) + hostnames em VARIAVEL
# no proxy_pass, para que o nginx RE-RESOLVA os servicos a cada requisicao.
# Sem isso, o nginx fixa o IP na inicializacao e, se um container reinicia e
# muda de IP, passa a dar 502.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # WebSocket do jogo -> play:3001 (mantem o caminho /ws/...)
    location /ws/ {
        set $up_play_ws play;
        proxy_pass http://$up_play_ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API do back -> back:8080 (remove o prefixo /api)
    location /api/ {
        set $up_back back;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$up_back:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Map storage -> map-storage:3000 (remove o prefixo /map-storage)
    location /map-storage/ {
        set $up_ms map-storage;
        rewrite ^/map-storage/(.*)$ /$1 break;
        proxy_pass http://$up_ms:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploader -> uploader:8080 (remove o prefixo /uploader)
    location /uploader/ {
        set $up_uploader uploader;
        rewrite ^/uploader/(.*)$ /$1 break;
        proxy_pass http://$up_uploader:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Icon server -> icon:8080 (remove o prefixo /icon)
    location /icon/ {
        set $up_icon icon;
        rewrite ^/icon/(.*)$ /$1 break;
        proxy_pass http://$up_icon:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Alvo de redirecionamento do icon server (mantem o caminho /lettericons)
    location /lettericons/ {
        set $up_icon2 icon;
        proxy_pass http://$up_icon2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Todo o resto -> play:3000 (o jogo / front)
    location / {
        set $up_play play;
        proxy_pass http://$up_play:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
