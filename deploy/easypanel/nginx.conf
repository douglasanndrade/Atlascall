# Atlas Call - roteamento interno (nginx) para rodar atras do proxy do EasyPanel.
# O EasyPanel termina o HTTPS e manda tudo para este nginx na porta 80.
# Aqui dividimos por caminho para cada servico do Atlas Call.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # WebSocket do jogo -> play:3001
    location /ws/ {
        proxy_pass http://play:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API do back -> back:8080 (remove o prefixo /api)
    location /api/ {
        proxy_pass http://back:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Map storage -> map-storage:3000 (remove o prefixo /map-storage)
    location /map-storage/ {
        proxy_pass http://map-storage:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploader -> uploader:8080 (remove o prefixo /uploader)
    location /uploader/ {
        proxy_pass http://uploader:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Icon server -> icon:8080 (remove o prefixo /icon)
    location /icon/ {
        proxy_pass http://icon:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Alvo de redirecionamento do icon server (mantem o caminho /lettericons)
    location /lettericons/ {
        proxy_pass http://icon:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Todo o resto -> play:3000 (o jogo / front)
    location / {
        proxy_pass http://play:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
