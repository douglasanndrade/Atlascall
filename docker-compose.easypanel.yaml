# Atlas Call - deploy no EasyPanel (atras do proxy/HTTPS do EasyPanel)
#
# No EasyPanel (servico do tipo Compose, fonte Git):
#   - Caminho de Build:        /
#   - Arquivo Docker Compose:  docker-compose.easypanel.yaml
#   - Dominio: aponte seu dominio do EasyPanel para o servico "proxy", porta 80
#   - Environment (aba do EasyPanel), defina:
#       DOMAIN=atlascall-atlascall.68tvlf.easypanel.host
#       SECRET_KEY=<uma string aleatoria longa>
#       MAP_STORAGE_AUTHENTICATION_USER=admin
#       MAP_STORAGE_AUTHENTICATION_PASSWORD=<uma senha forte>
#       TURN_SECRET=<uma string aleatoria longa> (senha do servidor TURN)
#
# Observacoes:
#   - "play" e BUILDADO do codigo (inclui o rebrand Atlas Call). O resto usa imagens oficiais :master.
#   - Chat (Matrix) comeca DESLIGADO para simplificar o primeiro deploy. Video/audio por proximidade funcionam.
#   - Para grupos com mais de 4 pessoas no mesmo circulo, depois configuramos LiveKit.

services:
  proxy:
    build:
      context: ./deploy/easypanel
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - play
      - back
      - map-storage
      - uploader
      - icon

  play:
    # Buildado do codigo-fonte -> aparece o rebrand Atlas Call
    build:
      context: .
      dockerfile: play/Dockerfile
    image: atlascall-play:local
    restart: unless-stopped
    environment:
      DEBUG_MODE: "false"
      PUSHER_URL: "https://atlascall-atlascall.68tvlf.easypanel.host/"
      FRONT_URL: "/"
      UPLOADER_URL: "/uploader"
      ICON_URL: "/icon"
      API_URL: "back:50051"
      INTERNAL_MAP_STORAGE_URL: "http://map-storage:3000"
      PUBLIC_MAP_STORAGE_URL: "https://atlascall-atlascall.68tvlf.easypanel.host/map-storage"
      REDIS_HOST: "redis"
      SECRET_KEY: "${SECRET_KEY}"
      MAP_STORAGE_API_TOKEN: "${SECRET_KEY}"
      ENABLE_OPENAPI_ENDPOINT: "true"
      DISABLE_ANONYMOUS: "false"
      START_ROOM_URL: "/_/global/workadventure.github.io/map-starter-kit/office.tmj"
      MAX_PER_GROUP: "6"
      MAX_USERNAME_LENGTH: "10"
      STUN_SERVER: "stun:stun.l.google.com:19302"
      # TURN: ponte de video/audio para quem esta em redes diferentes (resolve o "carregando")
      TURN_SERVER: "turn:157.230.52.86:3478"
      TURN_STATIC_AUTH_SECRET: "${TURN_SECRET}"
      ENABLE_MAP_EDITOR: "true"
      MAP_EDITOR_ALLOW_ALL_USERS: "true"
      ENABLE_CHAT: "true"
      ENABLE_CHAT_UPLOAD: "true"
      ENABLE_TUTORIAL: "true"
      MINIMUM_DISTANCE: "64"

  back:
    image: thecodingmachine/workadventure-back:master
    restart: unless-stopped
    environment:
      PLAY_URL: "https://atlascall-atlascall.68tvlf.easypanel.host"
      SECRET_KEY: "${SECRET_KEY}"
      REDIS_HOST: "redis"
      API_URL: "back:50051"
      MAP_STORAGE_URL: "map-storage:50053"
      INTERNAL_MAP_STORAGE_URL: "http://map-storage:3000"
      PUBLIC_MAP_STORAGE_URL: "https://atlascall-atlascall.68tvlf.easypanel.host/map-storage"
      ENABLE_MAP_EDITOR: "true"
      STORE_VARIABLES_FOR_LOCAL_MAPS: "true"
      MAX_PER_GROUP: "6"
      MAX_USERS_FOR_WEBRTC: "6"
      MINIMUM_DISTANCE: "64"
      GROUP_RADIUS: "48"
      STUN_SERVER: "stun:stun.l.google.com:19302"
      TURN_SERVER: "turn:157.230.52.86:3478"
      TURN_STATIC_AUTH_SECRET: "${TURN_SECRET}"
      ENABLE_CHAT: "true"

  map-storage:
    image: thecodingmachine/workadventure-map-storage:master
    restart: unless-stopped
    environment:
      API_URL: "back:50051"
      SECRET_KEY: "${SECRET_KEY}"
      MAP_STORAGE_API_TOKEN: "${SECRET_KEY}"
      PATH_PREFIX: "/map-storage"
      PUSHER_URL: "https://atlascall-atlascall.68tvlf.easypanel.host/"
      ENABLE_BASIC_AUTHENTICATION: "true"
      ENABLE_BEARER_AUTHENTICATION: "true"
      ENABLE_DIGEST_AUTHENTICATION: "false"
      AUTHENTICATION_USER: "admin"
      AUTHENTICATION_PASSWORD: "${MAP_STORAGE_AUTHENTICATION_PASSWORD}"
      AUTHENTICATION_TOKEN: "${SECRET_KEY}"
      ENTITY_COLLECTION_URLS: "https://atlascall-atlascall.68tvlf.easypanel.host/collections/FurnitureCollection.json,https://atlascall-atlascall.68tvlf.easypanel.host/collections/OfficeCollection.json"
    volumes:
      - map-storage-data:/maps

  uploader:
    image: thecodingmachine/workadventure-uploader:master
    restart: unless-stopped
    environment:
      UPLOADER_URL: "https://atlascall-atlascall.68tvlf.easypanel.host/uploader"
      REDIS_HOST: "redis"
      ENABLE_CHAT_UPLOAD: "false"

  icon:
    image: matthiasluedtke/iconserver:v3.21.0
    restart: unless-stopped

  # Servidor TURN: faz a "ponte" do video/audio entre pessoas em redes diferentes.
  # Sem isso, a chamada fica "carregando pra sempre". Usa a rede do host (VPS)
  # para abrir as portas UDP direto. Precisa das portas 3478 e 49160-49200/udp
  # liberadas no firewall da VPS (DigitalOcean: por padrao ja ficam abertas).
  coturn:
    image: coturn/coturn:4.8.0
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=atlascall
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --external-ip=157.230.52.86
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --no-cli

  redis:
    image: redis:6
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  redisdata:
  map-storage-data:
